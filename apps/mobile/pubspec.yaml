name: fixloop_mobile
description: Fix Loop's Flutter starter for Android and web.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.11.5 <4.0.0'
  flutter: '>=3.41.9'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  http_parser: ^4.0.2
  image_picker: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  fonts:
    - family: Bricolage Grotesque
      fonts:
        - asset: assets/fonts/BricolageGrotesque.ttf
    - family: Atkinson Hyperlegible Next
      fonts:
        - asset: assets/fonts/AtkinsonHyperlegibleNext.ttf
