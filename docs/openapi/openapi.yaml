openapi: 3.0.3
info:
  title: Fix Loop API
  version: 0.3.0
  description: >-
    REST API for Fix Loop: identity and rotating refresh tokens, campus
    reference directory, complaint intake with priority routing and SLA
    computation, optimistic-locked status workflow, attachment upload and
    authorized download, in-app notifications, and view-backed analytics. Every
    failed request uses the shared `ApiError` shape.

tags:
  - name: Health
  - name: Auth
  - name: Me
  - name: Directory
  - name: Complaints
  - name: Attachments
  - name: Notifications
  - name: Analytics

paths:
  /api/v1/health:
    get:
      tags: [Health]
      summary: API liveness (does not check the database)
      operationId: getApiHealth
      security: []
      responses:
        '200':
          description: API process is responding
          headers:
            X-Trace-Id:
              description: Opaque identifier for this request
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                type: object
                required: [status, service]
                properties:
                  status:
                    type: string
                    example: UP
                  service:
                    type: string
                    example: fixloop-api

  /actuator/health:
    get:
      tags: [Health]
      summary: Readiness (includes the database)
      operationId: getReadiness
      security: []
      responses:
        '200':
          description: Application and database are healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActuatorHealth'
        '503':
          description: A required component is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActuatorHealth'

  /api/v1/auth/register:
    post:
      tags: [Auth]
      summary: Register a student account
      operationId: registerStudent
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/ClientError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Exchange email and password for tokens
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Access and rotating refresh tokens
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/ClientError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      summary: Rotate refresh token and issue a new access token
      operationId: refresh
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: New tokens
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/ClientError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: Revoke the presented refresh token
      operationId: logout
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '204':
          description: Revoked, or already invalid
        '400':
          $ref: '#/components/responses/ClientError'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/auth/change-password:
    post:
      tags: [Auth]
      summary: Change caller's password and revoke other sessions
      operationId: changePassword
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: Password changed
        '400':
          $ref: '#/components/responses/ClientError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/me:
    get:
      tags: [Me]
      summary: Caller's own account, role and scope
      operationId: getMe
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Authenticated account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /api/v1/categories:
    get:
      tags: [Directory]
      summary: List active issue categories ordered by sortOrder
      operationId: listCategories
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Active categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategoryResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /api/v1/locations:
    get:
      tags: [Directory]
      summary: List active campus locations ordered by materialised path
      operationId: listLocations
      security:
        - bearerAuth: []
      parameters:
        - name: parentId
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Active locations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LocationResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /api/v1/departments:
    get:
      tags: [Directory]
      summary: List active departments visible to the caller
      operationId: listDepartments
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Visible active departments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DepartmentResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /api/v1/users/staff:
    get:
      tags: [Directory]
      summary: List active STAFF and SUPERVISOR members for assignment
      operationId: listStaff
      security:
        - bearerAuth: []
      parameters:
        - name: departmentId
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Staff directory
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StaffMemberResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/complaints:
    get:
      tags: [Complaints]
      summary: List complaints visible to caller with pagination and filters
      operationId: listComplaints
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema: {type: string}
        - name: departmentId
          in: query
          schema: {type: string, format: uuid}
        - name: mine
          in: query
          schema: {type: boolean}
        - name: assignedToMe
          in: query
          schema: {type: boolean}
        - name: unclaimed
          in: query
          schema: {type: boolean}
        - name: overdue
          in: query
          schema: {type: boolean}
        - name: q
          in: query
          schema: {type: string}
        - name: sort
          in: query
          schema: {type: string, enum: [recent, priority]}
        - name: page
          in: query
          schema: {type: integer, default: 0}
        - name: size
          in: query
          schema: {type: integer, default: 20}
      responses:
        '200':
          description: Paginated complaint summaries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplaintPageResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
    post:
      tags: [Complaints]
      summary: Submit a new complaint with auto-routing and SLA computation
      operationId: createComplaint
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
            maxLength: 100
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateComplaintRequest'
      responses:
        '201':
          description: Created complaint (or idempotent replay)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplaintDetailResponse'
        '400':
          $ref: '#/components/responses/ClientError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ClientError'

  /api/v1/complaints/similar:
    get:
      tags: [Complaints]
      summary: Check count of open non-sensitive complaints at the same location and category
      operationId: findSimilarComplaints
      security:
        - bearerAuth: []
      parameters:
        - name: locationId
          in: query
          required: true
          schema: {type: string, format: uuid}
        - name: categoryId
          in: query
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Similar open issue count
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimilarComplaintsResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /api/v1/complaints/{id}:
    get:
      tags: [Complaints]
      summary: Get full complaint details, event timeline, and attachment metadata
      operationId: getComplaint
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Complaint detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplaintDetailResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/complaints/{id}/transition:
    post:
      tags: [Complaints]
      summary: Perform a role-validated, optimistic-locked status transition
      operationId: transitionComplaint
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransitionRequest'
      responses:
        '200':
          description: Updated complaint
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplaintDetailResponse'
        '400':
          $ref: '#/components/responses/ClientError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ClientError'

  /api/v1/complaints/{id}/notes:
    post:
      tags: [Complaints]
      summary: Add an audit note to a complaint
      operationId: addComplaintNote
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddNoteRequest'
      responses:
        '200':
          description: Updated complaint with note event
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplaintDetailResponse'
        '400':
          $ref: '#/components/responses/ClientError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/attachments:
    post:
      tags: [Attachments]
      summary: Upload a complaint or resolution photograph
      operationId: uploadAttachment
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachmentResponse'
        '400':
          $ref: '#/components/responses/ClientError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/attachments/{id}/content:
    get:
      tags: [Attachments]
      summary: Download an attachment photograph authorized against its complaint
      operationId: downloadAttachment
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Binary photograph stream
          content:
            image/*:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Metadata missing or file missing (`ATTACHMENT_FILE_MISSING`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/v1/notifications:
    get:
      tags: [Notifications]
      summary: List caller's in-app notifications and unread count
      operationId: listNotifications
      security:
        - bearerAuth: []
      responses:
        '200':
          description: In-app notifications
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationListResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /api/v1/notifications/{id}/read:
    post:
      tags: [Notifications]
      summary: Mark a notification as read
      operationId: markNotificationRead
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Updated notification
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/analytics/summary:
    get:
      tags: [Analytics]
      summary: Role-scoped analytics backed by PostgreSQL views
      operationId: getAnalyticsSummary
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Aggregate counts and breakdowns
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsSummaryResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    ClientError:
      description: Request rejected
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unauthenticated:
      description: Missing, expired or invalid token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Forbidden:
      description: Caller is not authorized for this resource
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Conflict:
      description: Optimistic lock or duplicate conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    TooManyRequests:
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    PayloadTooLarge:
      description: Upload exceeds configured byte limit
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    UnsupportedMediaType:
      description: File content is not an accepted photograph format
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

  schemas:
    ApiError:
      type: object
      required: [code, message, traceId]
      properties:
        code: {type: string, example: VALIDATION_FAILED}
        message: {type: string}
        traceId: {type: string, format: uuid}
        details:
          type: object
          additionalProperties: {type: string}

    RegisterRequest:
      type: object
      required: [email, password, fullName]
      properties:
        email: {type: string, format: email, maxLength: 254}
        password: {type: string, minLength: 12, maxLength: 200}
        fullName: {type: string, minLength: 2, maxLength: 120}

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: {type: string, format: email, maxLength: 254}
        password: {type: string, maxLength: 200}

    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: {type: string, maxLength: 200}

    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: {type: string, maxLength: 200}
        newPassword: {type: string, minLength: 12, maxLength: 200}

    TokenResponse:
      type: object
      required: [accessToken, tokenType, expiresInSeconds, refreshToken]
      properties:
        accessToken: {type: string}
        tokenType: {type: string, example: Bearer}
        expiresInSeconds: {type: integer, format: int64, example: 900}
        refreshToken: {type: string}

    UserResponse:
      type: object
      required: [id, email, fullName, role, mustChangePassword]
      properties:
        id: {type: string, format: uuid}
        email: {type: string, format: email}
        fullName: {type: string}
        role: {type: string, enum: [STUDENT, STAFF, SUPERVISOR, ADMIN]}
        departmentId: {type: string, format: uuid, nullable: true}
        scopeLocationId: {type: string, format: uuid, nullable: true}
        emailVerified: {type: boolean}
        mustChangePassword: {type: boolean}

    CategoryResponse:
      type: object
      required: [id, name, theme, defaultSeverity, photoPolicy, isSensitive, sortOrder]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        theme: {type: string}
        defaultSeverity: {type: string, enum: [LOW, MEDIUM, HIGH, CRITICAL]}
        photoPolicy: {type: string, enum: [OPTIONAL, REQUIRED, DISABLED]}
        isSensitive: {type: boolean}
        sortOrder: {type: integer}

    LocationResponse:
      type: object
      required: [id, type, name, path]
      properties:
        id: {type: string, format: uuid}
        parentId: {type: string, format: uuid, nullable: true}
        type: {type: string}
        name: {type: string}
        path: {type: string}

    DepartmentResponse:
      type: object
      required: [id, name, code, kind]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        code: {type: string}
        kind: {type: string, enum: [SERVICE, RESTRICTED]}
        headUserId: {type: string, format: uuid, nullable: true}

    StaffMemberResponse:
      type: object
      required: [id, fullName, email, role]
      properties:
        id: {type: string, format: uuid}
        fullName: {type: string}
        email: {type: string}
        role: {type: string, enum: [STAFF, SUPERVISOR]}
        departmentId: {type: string, format: uuid, nullable: true}
        departmentName: {type: string, nullable: true}
        scopeLocationId: {type: string, format: uuid, nullable: true}

    CreateComplaintRequest:
      type: object
      required: [categoryId, locationId, title]
      properties:
        categoryId: {type: string, format: uuid}
        locationId: {type: string, format: uuid}
        title: {type: string, minLength: 5, maxLength: 120}
        description: {type: string, maxLength: 2000}
        severity: {type: string, enum: [LOW, MEDIUM, HIGH, CRITICAL]}
        attachmentKeys:
          type: array
          items: {type: string}

    TransitionRequest:
      type: object
      required: [toStatus, version]
      properties:
        toStatus: {type: string, enum: [ASSIGNED, IN_PROGRESS, RESOLVED, VERIFIED, REOPENED, REJECTED]}
        version: {type: integer}
        note: {type: string, maxLength: 2000}
        departmentId: {type: string, format: uuid}
        assignedTo: {type: string, format: uuid}
        attachmentKeys:
          type: array
          items: {type: string}

    AddNoteRequest:
      type: object
      required: [note]
      properties:
        note: {type: string, maxLength: 2000}

    ReporterSummary:
      type: object
      required: [id, fullName, email]
      properties:
        id: {type: string, format: uuid}
        fullName: {type: string}
        email: {type: string}

    ComplaintAttachmentResponse:
      type: object
      required: [id, kind, storageKey, mimeType, sizeBytes, createdAt]
      properties:
        id: {type: string, format: uuid}
        eventId: {type: integer, format: int64, nullable: true}
        kind: {type: string}
        storageKey: {type: string}
        mimeType: {type: string}
        sizeBytes: {type: integer, format: int64}
        createdAt: {type: string, format: date-time}

    ComplaintEventResponse:
      type: object
      required: [id, actorRole, eventType, payload, createdAt]
      properties:
        id: {type: integer, format: int64}
        actorRole: {type: string}
        actorName: {type: string, nullable: true}
        eventType: {type: string}
        fromStatus: {type: string, nullable: true}
        toStatus: {type: string, nullable: true}
        payload: {type: object, additionalProperties: true}
        createdAt: {type: string, format: date-time}

    ComplaintSummaryResponse:
      type: object
      required: [id, code, title, severity, status, categoryId, categoryName, locationId, locationName, locationPath, version, isMine, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        code: {type: string, example: FL-2026-000027}
        title: {type: string}
        description: {type: string, nullable: true}
        severity: {type: string}
        status: {type: string}
        categoryId: {type: string, format: uuid}
        categoryName: {type: string}
        categoryTheme: {type: string}
        isSensitive: {type: boolean}
        photoPolicy: {type: string}
        locationId: {type: string, format: uuid}
        locationName: {type: string}
        locationPath: {type: string}
        departmentId: {type: string, format: uuid, nullable: true}
        departmentName: {type: string, nullable: true}
        departmentCode: {type: string, nullable: true}
        assignedTo: {type: string, format: uuid, nullable: true}
        assigneeName: {type: string, nullable: true}
        slaDueAt: {type: string, format: date-time, nullable: true}
        escalationLevel: {type: integer}
        reopenCount: {type: integer}
        version: {type: integer}
        isMine: {type: boolean}
        reporter: {$ref: '#/components/schemas/ReporterSummary'}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        resolvedAt: {type: string, format: date-time, nullable: true}
        verifiedAt: {type: string, format: date-time, nullable: true}

    ComplaintDetailResponse:
      allOf:
        - $ref: '#/components/schemas/ComplaintSummaryResponse'
        - type: object
          required: [events, attachments]
          properties:
            events:
              type: array
              items: {$ref: '#/components/schemas/ComplaintEventResponse'}
            attachments:
              type: array
              items: {$ref: '#/components/schemas/ComplaintAttachmentResponse'}

    ComplaintPageResponse:
      type: object
      required: [items, page, size, totalElements, totalPages]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/ComplaintSummaryResponse'}
        page: {type: integer}
        size: {type: integer}
        totalElements: {type: integer, format: int64}
        totalPages: {type: integer}

    SimilarComplaintsResponse:
      type: object
      required: [count, byStatus]
      properties:
        count: {type: integer, format: int64}
        mostCommonStatus: {type: string, nullable: true}
        byStatus:
          type: object
          additionalProperties: {type: integer, format: int64}

    AttachmentResponse:
      type: object
      required: [storageKey, mimeType, sizeBytes, checksumSha256]
      properties:
        storageKey: {type: string}
        mimeType: {type: string}
        sizeBytes: {type: integer, format: int64}
        checksumSha256: {type: string}

    NotificationResponse:
      type: object
      required: [id, type, message, status, createdAt, payload]
      properties:
        id: {type: string, format: uuid}
        type: {type: string}
        message: {type: string}
        complaintId: {type: string, format: uuid, nullable: true}
        status: {type: string}
        createdAt: {type: string, format: date-time}
        readAt: {type: string, format: date-time, nullable: true}
        payload: {type: object, additionalProperties: true}

    NotificationListResponse:
      type: object
      required: [unreadCount, items]
      properties:
        unreadCount: {type: integer, format: int64}
        items:
          type: array
          items: {$ref: '#/components/schemas/NotificationResponse'}

    AnalyticsSummaryResponse:
      type: object
      required: [totalComplaints, openCount, inProgressCount, awaitingVerificationCount, verifiedCount, rejectedCount, overdueCount, byStatus, byDepartment, createdPerDay]
      properties:
        totalComplaints: {type: integer, format: int64}
        openCount: {type: integer, format: int64}
        inProgressCount: {type: integer, format: int64}
        awaitingVerificationCount: {type: integer, format: int64}
        verifiedCount: {type: integer, format: int64}
        rejectedCount: {type: integer, format: int64}
        overdueCount: {type: integer, format: int64}
        byStatus:
          type: array
          items:
            type: object
            properties:
              status: {type: string}
              count: {type: integer, format: int64}
        byDepartment:
          type: array
          items:
            type: object
            properties:
              departmentId: {type: string, format: uuid}
              departmentCode: {type: string}
              departmentName: {type: string}
              openCount: {type: integer, format: int64}
        createdPerDay:
          type: array
          items:
            type: object
            properties:
              day: {type: string, format: date}
              count: {type: integer, format: int64}

    ActuatorHealth:
      type: object
      required: [status]
      properties:
        status: {type: string, example: UP}
